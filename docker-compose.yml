name: depth-pro-2

services:
  depth-pro-2:
    build:
      context: .
      args:
        TORCH_BACKEND: ${TORCH_BACKEND:-cu126}
    image: depth-pro-2:local
    # The image exists on no registry. Without this, Compose tries to pull it first.
    pull_policy: build
    # The files in ./out get this owner.
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # A missing GPU stops the run. Without this, the model falls back to the CPU.
      DEPTH_PRO_2_DEVICE: ${DEPTH_PRO_2_DEVICE:-cuda}
      # PyTorch saves the weights readable by their owner only, so each user id has its own.
      XDG_CACHE_HOME: /cache/uid-${PUID:-1000}
    command: ["predict", "-i", "/in", "-o", "/out"]
    volumes:
      # create_host_path: false stops Docker from making a root-owned folder on the host.
      - type: bind
        source: ${DP2_IN:-./in}
        target: /in
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DP2_OUT:-./out}
        target: /out
        bind:
          create_host_path: false
      - type: volume
        source: cache
        target: /cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # docker compose run --rm nvidia-smi lists the GPUs that the container sees.
  nvidia-smi:
    extends:
      service: depth-pro-2
    profiles: [tools]
    entrypoint: ["nvidia-smi"]
    command: []

volumes:
  cache:
